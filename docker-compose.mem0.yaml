# Qdrant for secretary daemon (Mem0 connects directly — no Mem0 server needed)
# Run: docker compose -f docker-compose.mem0.yaml up -d

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: secretary-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - secretary-qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  secretary-qdrant-data:
    driver: local
